<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Step02_UndoRedo</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="canvasContainer">
      <canvas class="pageCanvas" data-layer="1"></canvas>
      <canvas class="pageCanvas" data-layer="2"></canvas>
      <canvas class="pageCanvas" data-layer="3"></canvas>
    </div>

    <!-- ==================================================
     現在のLayer表示
================================================== -->

    <div id="layerDisplay">現在のLayer : Layer 1 / 表示</div>

    <!-- ==================================================
     Debug表示
================================================== -->

    <div id="debug"></div>

    <!-- ==================================================
         UI
    ================================================== -->

    <div id="toolbar">
      <button id="undoButton" type="button">↶</button>

      <button id="redoButton" type="button">↷</button>

      <button id="initializeButton" type="button">初期化</button>
    </div>

    <!-- ==================================================
         Debug
    ================================================== -->

    <div id="debug">pointerType :</div>

    <script type="module" src="scripts.js"></script>
  </body>
</html>
